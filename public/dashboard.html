<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Chat App | Rup Hasan</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Nothing but marketing -->
        <header>
            <h1>Welcome to chat app!</h1>
            <h2 id="autotype-container">
                Creatd By Rup Hasan <br />
                <span id="autoType"></span>
            </h2>
        </header>

        <hr />

        <!-- All the main work here -->
        <main>
            <section id="msg-container-main"></section>
            <hr id="end-point" />
            <div>
                <input
                    type="text"
                    id="userMsgInput"
                    placeholder="Enter message "
                />
                <button id="send-msg-btn" onclick="sendMsg()">Send</button>
            </div>
        </main>

        <!-- Script tags here -->
        <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.16/dist/typed.umd.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="script.js"></script>
    </body>
</html>
