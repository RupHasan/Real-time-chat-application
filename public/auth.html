<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Login page | Rup Hasan</title>
        <link rel="stylesheet" href="auth.css">
    </head>
    <body>
        <h2>
            Hey User! If youre new here, make sure to sign up, or else just log
            in. Anyway, created by <i>Rup Hasan 😎</i>
        </h2>

        <main>
            <section id="signup-container">
                <h3>Sign-up</h3>
                <form action="/auth/signup" method="POST">
                    <input
                        type="text"
                        name="username"
                        id="username-su"
                        placeholder="Enter your username "
                        required
                    />
                    <input
                        type="password"
                        name="password"
                        id="password-su"
                        placeholder="Enter your password "
                        required
                    />
                    <input
                        type="email"
                        name="email"
                        id="email-su"
                        placeholder="Enter your email (optional)"
                    />
                    <input
                        type="number"
                        name="phnNumber"
                        id="number-su"
                        placeholder="Enter your phone number (optional)"
                    />
                    <button type="submit">Create Account!</button>
                </form>
            </section>

            <hr />

            <section id="login-container">
                <h3>Log in</h3>

                <form action="/auth/login" method="POST">
                    <input
                        type="text"
                        name="username"
                        id="username-l"
                        placeholder="Enter your username "
                        required
                    />
                    <input
                        type="password"
                        name="password"
                        id="password-l"
                        placeholder="Enter your password "
                        required
                    />
                    <button type="submit">Log in!</button>
                </form>
            </section>
        </main>
    </body>
</html>
